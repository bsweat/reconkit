services:
  - type: web
    name: reconkit
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SHODAN_API_KEY
        sync: false
      - key: VIRUSTOTAL_API_KEY
        sync: false
      - key: HUNTER_API_KEY
        sync: false
      - key: IPINFO_TOKEN
        sync: false
